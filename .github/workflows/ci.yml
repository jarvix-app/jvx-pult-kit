name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Сверка имён команд с утилитой пропускается явно (переменная PULT_OPERATIONS_JS не задана): репозиторий
      # jvx-pult закрытый и в эту сборку не подтягивается.
      - run: node --test
